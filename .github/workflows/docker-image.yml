# Construye la imagen Docker del sitio en cada push a main y la publica en
# GitHub Container Registry: ghcr.io/josegp23/pagina-web-diamond
# Azure Container Apps la descarga desde ahí (la suscripción de estudiante
# no permite construir imágenes dentro de Azure).
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/josegp23/pagina-web-diamond

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Inicio de sesión sin contraseñas (OIDC): Azure confía en los tokens
      # que GitHub emite solo para la rama main de este repo, mediante la
      # identidad administrada "diamante-github-deployer" (rol Contributor
      # únicamente sobre el grupo diamante-rg). Estos IDs no son secretos.
      - uses: azure/login@v2
        with:
          client-id: 7d43815e-01a2-4d94-be79-92ad1a2df49f
          tenant-id: c06fb559-1b68-4b84-a14f-47d0d837a5ab
          subscription-id: e130c011-17eb-4341-a6e0-d8cdd27c51cc

      - name: Actualizar Azure Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name diamante-web \
            --resource-group diamante-rg \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --query "properties.latestRevisionName" -o tsv
